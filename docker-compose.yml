version: "3.8"

services:
  # ================= MySQL 8.0 =================
  mysql:
    image: mysql:8.0
    container_name: campus_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - campus_net

  # ================= Redis 7 =================
  redis:
    image: redis:7-alpine
    container_name: campus_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - campus_net

  # ================= 后端 Django + Gunicorn =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py init_categories &&
             python manage.py create_default_admin &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile -"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - campus_net

  # ================= Celery Worker =================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - campus_net

  # ================= Celery Beat =================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - campus_net

  # ================= 前端构建 =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_frontend
    restart: "no"
    volumes:
      - frontend_dist:/output
    depends_on:
      - backend
    networks:
      - campus_net

  # ================= Nginx 反向代理 =================
  nginx:
    image: nginx:1.27-alpine
    container_name: campus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - media_volume:/var/www/media:ro
      - static_volume:/var/www/static:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    networks:
      - campus_net

networks:
  campus_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  media_volume:
  static_volume:
  frontend_dist: