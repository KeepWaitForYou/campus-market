# ============================================================
# 校园二手交易平台 - Redis 7 配置文件
# 挂载到容器内 /usr/local/etc/redis/redis.conf
# ============================================================

# 绑定容器内地址
bind 0.0.0.0
# Docker 内网部署：Redis 未对外暴露端口，仅容器网络内可达；
# 关闭 protected-mode，否则非本机客户端（backend/celery）会被拒绝连接
protected-mode no
port 6379

# 持久化：AOF + RDB 双开
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# 内存上限与淘汰策略（缓存类数据，可安全淘汰）
maxmemory 256mb
maxmemory-policy allkeys-lru

# 基础时延优化
tcp-keepalive 60
timeout 0